# devDependencies と GitHub Actions の新版を、月に 1 回まとめて確認する。
# コミットメッセージはコミット規約（chore(deps): ...）に合わせる。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # engines.vscode より新しい @types/vscode にすると vsce package が失敗する。engines と一緒に手で上げる
      - dependency-name: '@types/vscode'
      # Node のメジャーは CI と engines に合わせて手で上げる
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint が対応する範囲を超えると npm ci が失敗する（7.0.2 で実際に起きた）。
      # typescript-eslint の peerDependencies が新しいメジャーを含んでから手で上げる
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # mermaid 12 は ELK が既定のレイアウトになり、状態遷移図の往復の矢印が回り込んで読みにくい。
      # VS Code 本体のプレビューと同じ 11 系に揃える（packaging.test.ts で固定している）
      - dependency-name: 'mermaid'
        update-types: ['version-update:semver-major']
      # katex は数式の CSS とフォントを写すためだけに入れている。HTML を作る @vscode/markdown-it-katex が
      # 依存する 0.16 系と揃える（0.18 で CSS のクラス名が変わり、版がずれると数式が崩れる）。
      # 0.x では minor が破壊的変更にあたる。@vscode/markdown-it-katex が上げてから手で上げる
      - dependency-name: 'katex'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
